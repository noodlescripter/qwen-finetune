<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Code Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #eee;
            min-height: 100vh;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        h1 { text-align: center; color: #00d9ff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }

        .status {
            text-align: center; padding: 8px; margin-bottom: 20px;
            border-radius: 8px; font-size: 13px;
        }
        .status.connected { background: rgba(0, 217, 255, 0.1); color: #00d9ff; }
        .status.disconnected { background: rgba(233, 69, 96, 0.1); color: #e94560; }

        .tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .tab {
            flex: 1; padding: 12px; text-align: center;
            background: #1a1a2e; border: none; border-radius: 8px;
            color: #888; cursor: pointer; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
        }
        .tab:hover { background: #252540; }
        .tab.active { background: #00d9ff; color: #0f0f1a; }

        .panel { display: none; }
        .panel.active { display: block; }

        .section {
            background: #1a1a2e; border-radius: 10px;
            padding: 15px; margin-bottom: 15px;
        }
        .section label {
            display: block; margin-bottom: 8px;
            color: #00d9ff; font-size: 13px; font-weight: 500;
        }

        textarea, input[type="text"] {
            width: 100%; background: #0f0f1a; border: 1px solid #333;
            border-radius: 6px; color: #eee; padding: 12px;
            font-family: 'Fira Code', monospace; font-size: 13px;
        }
        textarea { resize: vertical; min-height: 100px; }
        textarea:focus, input:focus { outline: none; border-color: #00d9ff; }

        .btn {
            background: #00d9ff; color: #0f0f1a; border: none;
            padding: 10px 30px; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #00b8d9; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .btn-row { text-align: center; margin: 15px 0; }

        .output-box {
            background: #1a1a2e; border-radius: 10px; padding: 15px;
        }
        .output-box h3 {
            color: #00d9ff; font-size: 13px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .output-content {
            background: #0f0f1a; border-radius: 6px; padding: 12px;
            font-family: 'Fira Code', monospace; font-size: 13px;
            white-space: pre-wrap; min-height: 80px; line-height: 1.5;
        }

        .files-tag {
            font-size: 11px; color: #888; font-weight: normal;
        }
        .files-tag span {
            background: #333; padding: 2px 8px; border-radius: 4px; margin-left: 5px;
        }

        .file-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        .file-item {
            background: #0f0f1a; border-radius: 6px; padding: 12px;
            border: 1px solid #333;
        }
        .file-item:hover { border-color: #00d9ff; }
        .file-name { color: #00d9ff; font-weight: 500; font-size: 13px; }
        .file-path { color: #666; font-size: 11px; margin: 4px 0; }
        .file-summary { color: #888; font-size: 12px; }

        .loading {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; color: #666; padding: 20px;
        }
        .spinner {
            width: 18px; height: 18px; border: 2px solid #333;
            border-top-color: #00d9ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error { color: #e94560; }
        .hint { font-size: 11px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qwen Code Assistant</h1>
        <p class="subtitle">Ask questions about your codebase or get code fixes</p>

        <div id="status" class="status disconnected">Connecting...</div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ask')">Ask About Code</button>
            <button class="tab" onclick="switchTab('fix')">Fix Code</button>
            <button class="tab" onclick="switchTab('files')">Browse Files</button>
        </div>

        <!-- Ask Panel -->
        <div id="ask-panel" class="panel active">
            <div class="section">
                <label>Ask a question about your codebase:</label>
                <input type="text" id="question" placeholder="What does the logger module do?" />
                <p class="hint">Examples: "What is AuthService?", "How does the cache work?", "Explain the User model"</p>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="askQuestion()">Ask</button>
            </div>
            <div class="output-box">
                <h3>Answer <span class="files-tag" id="ask-files"></span></h3>
                <div class="output-content" id="ask-output">Response will appear here...</div>
            </div>
        </div>

        <!-- Fix Panel -->
        <div id="fix-panel" class="panel">
            <div class="section">
                <label>Broken Code:</label>
                <textarea id="code" placeholder="Paste your broken code here..."></textarea>
            </div>
            <div class="section">
                <label>Error Message (optional):</label>
                <input type="text" id="error" placeholder="TypeError: undefined is not a function" />
            </div>
            <div class="btn-row">
                <button class="btn" onclick="fixCode()">Get Fix</button>
            </div>
            <div class="output-box">
                <h3>Suggested Fix <span class="files-tag" id="fix-files"></span></h3>
                <div class="output-content" id="fix-output">Fixed code will appear here...</div>
            </div>
        </div>

        <!-- Files Panel -->
        <div id="files-panel" class="panel">
            <div class="btn-row">
                <button class="btn" onclick="loadFiles()">Refresh</button>
                <button class="btn" onclick="reindex()" style="background: #9d4edd;">Re-index</button>
            </div>
            <div id="files-list" class="file-list"></div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8000';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'ask' ? 1 : tab === 'fix' ? 2 : 3})`).classList.add('active');
            document.getElementById(`${tab}-panel`).classList.add('active');
            if (tab === 'files') loadFiles();
        }

        async function checkHealth() {
            const status = document.getElementById('status');
            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                status.className = 'status connected';
                status.textContent = `Connected - ${data.files_indexed} files indexed`;
            } catch {
                status.className = 'status disconnected';
                status.textContent = 'Disconnected - Run: uvicorn api:app --port 8000';
            }
        }

        async function askQuestion() {
            const question = document.getElementById('question').value;
            const output = document.getElementById('ask-output');
            const filesTag = document.getElementById('ask-files');

            if (!question.trim()) return alert('Enter a question');

            output.innerHTML = '<div class="loading"><div class="spinner"></div>Thinking...</div>';
            filesTag.innerHTML = '';

            try {
                const res = await fetch(`${API}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                output.textContent = data.answer || 'No answer generated';
                if (data.relevant_files?.length) {
                    filesTag.innerHTML = 'Used: ' + data.relevant_files.map(f => `<span>${f}</span>`).join('');
                }
            } catch (e) {
                output.innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }

        async function fixCode() {
            const code = document.getElementById('code').value;
            const error = document.getElementById('error').value;
            const output = document.getElementById('fix-output');
            const filesTag = document.getElementById('fix-files');

            if (!code.trim()) return alert('Enter some code');

            output.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing...</div>';
            filesTag.innerHTML = '';

            try {
                const res = await fetch(`${API}/fix`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, error })
                });
                const data = await res.json();
                output.textContent = data.suggestion || 'No suggestion generated';
                if (data.relevant_files?.length) {
                    filesTag.innerHTML = 'Referenced: ' + data.relevant_files.map(f => `<span>${f}</span>`).join('');
                }
            } catch (e) {
                output.innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }

        async function loadFiles() {
            const list = document.getElementById('files-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const res = await fetch(`${API}/files`);
                const files = await res.json();

                if (files.length === 0) {
                    list.innerHTML = '<p style="color:#666;text-align:center;">No files indexed. Add files to ./data and click Re-index.</p>';
                    return;
                }

                list.innerHTML = files.map(f => `
                    <div class="file-item">
                        <div class="file-name">${f.filename}</div>
                        <div class="file-path">${f.path} (${f.lines} lines)</div>
                        <div class="file-summary">${f.summary || 'No description'}</div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = `<span class="error">Error loading files</span>`;
            }
        }

        async function reindex() {
            try {
                const res = await fetch(`${API}/reindex`, { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                loadFiles();
                checkHealth();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        // Keyboard shortcuts
        document.getElementById('question').addEventListener('keydown', e => {
            if (e.key === 'Enter') askQuestion();
        });
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') {
                const active = document.querySelector('.panel.active').id;
                if (active === 'ask-panel') askQuestion();
                else if (active === 'fix-panel') fixCode();
            }
        });

        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
