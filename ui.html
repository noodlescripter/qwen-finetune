<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Code Fixer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00d9ff;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .status {
            text-align: center;
            padding: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.connected {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
        }

        .status.disconnected {
            background: rgba(233, 69, 96, 0.1);
            color: #e94560;
        }

        .section {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section label {
            display: block;
            margin-bottom: 8px;
            color: #00d9ff;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 8px;
            color: #eee;
            padding: 15px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }

        #code {
            height: 150px;
        }

        #error {
            height: 60px;
        }

        .btn {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }

        .btn:hover {
            background: #00b8d9;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .output-box {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }

        .output-box h3 {
            color: #00d9ff;
            margin-bottom: 15px;
        }

        .output-content {
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #aaa;
            min-height: 120px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: #e94560;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qwen Code Fixer</h1>
        <p class="subtitle">Paste broken code, get fix suggestions</p>

        <div id="status" class="status disconnected">Checking connection...</div>

        <div class="section">
            <label for="code">Broken Code:</label>
            <textarea id="code" placeholder="def calculate_sum(numbers)
    return sum(numbers)  # missing colon"></textarea>
        </div>

        <div class="section">
            <label for="error">Error Message (optional):</label>
            <textarea id="error" placeholder="SyntaxError: expected ':'"></textarea>
            <p class="hint">Adding the error message helps generate better suggestions</p>
        </div>

        <button class="btn" id="fixBtn" onclick="fixCode()">Fix Code</button>

        <div class="output-box">
            <h3>Suggestion:</h3>
            <div class="output-content" id="output">Fixed code will appear here...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function checkHealth() {
            const status = document.getElementById('status');
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    status.className = 'status connected';
                    status.textContent = 'Connected to API';
                } else {
                    throw new Error('Not responding');
                }
            } catch (error) {
                status.className = 'status disconnected';
                status.textContent = 'Disconnected - Run: uvicorn api:app --port 8000';
            }
        }

        async function fixCode() {
            const code = document.getElementById('code').value;
            const error = document.getElementById('error').value;
            const btn = document.getElementById('fixBtn');
            const output = document.getElementById('output');

            if (!code.trim()) {
                alert('Please enter some code');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Fixing...';
            output.innerHTML = '<div class="loading"><div class="spinner"></div>Generating suggestion...</div>';

            try {
                const response = await fetch(`${API_URL}/fix`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        error: error,
                        max_new_tokens: 150
                    })
                });

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();
                output.textContent = data.suggestion || 'No suggestion generated';
            } catch (error) {
                output.innerHTML = `<span class="error-msg">Error: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Fix Code';
            }
        }

        // Ctrl+Enter to fix
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                fixCode();
            }
        });

        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
